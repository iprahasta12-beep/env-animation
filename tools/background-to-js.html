<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Background to JS</title>
<style>
  :root { --bg:#0d0a08; --text:#f1e7dc; --muted:#a08d7c; --accent:#e8742c; --line:#3a2a1f; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  main { max-width:520px; padding:24px; }
  h1 { font-size:16px; letter-spacing:.08em; text-transform:uppercase; }
  p { color:var(--muted); }
  label { display:block; border:1.5px dashed #5a412e; border-radius:12px; padding:28px; text-align:center; cursor:pointer; }
  label:hover { border-color:var(--accent); }
  code { font-family:ui-monospace, Menlo, Consolas, monospace; color:var(--text); }
</style>
</head>
<body>
<main>
  <h1>Background → background.js</h1>
  <p>Pick a new background PNG/JPG. You get <code>background.js</code>. Put it in <code>assets/</code> (replace old one), reload <code>index.html</code>.</p>
  <label>Choose image<input type="file" id="f" accept="image/*" hidden></label>
  <p id="out"></p>
</main>
<script>
  document.getElementById('f').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      const js = '// Generated from ' + file.name + '\nwindow.BG_DATA_URL = "' + r.result + '";\n';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
      a.download = 'background.js'; a.click();
      document.getElementById('out').textContent = 'Done: background.js (' + Math.round(js.length / 1024) + ' KB). Note: demo animations are positioned for the original crossroads background.';
    };
    r.readAsDataURL(file);
  };
</script>
</body>
</html>
